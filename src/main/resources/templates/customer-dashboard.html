<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Customer Dashboard - Order Management</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <script defer src="/js/app.js"></script>
  <style> body { padding: 0 12px; } </style>
  
</head>
<body>
  <div class="container">
  <h1 class="title">Customer Dashboard</h1>
  <p class="subtle">Manage customers for your order management system.</p>
  <div class="toolbar">
    <a class="btn btn-primary" href="/customers/create">+ Create Customer</a>
    <a class="btn" href="/orders">View Orders</a>
    <a class="btn" href="/payments">Check Payments</a>
  </div>
  <table>
  <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Contact</th><th>Actions</th></tr></thead>
    <tbody>
      <tr th:each="s : ${customers}">
        <td th:text="${s.id}">1</td>
        <td th:text="${s.name}">Customer Name</td>
        <td th:text="${s.email}">email</td>
      <td th:text="${s.contactNumber}">0123</td>
      <td>
        <div class="actions">
          <a class="btn" th:href="@{'/customers/edit/' + ${s.id}}">Edit</a>
          <form th:action="@{'/customers/delete/' + ${s.id}}" method="post" style="display:inline">
            <button class="btn btn-danger" type="submit" data-confirm="Delete this customer?">Delete</button>
          </form>
        </div>
      </td>
      </tr>
    </tbody>
  </table>
  </div>
</body>
</html>
