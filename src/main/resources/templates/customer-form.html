<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title th:text="${customer.id} != null ? 'Edit Customer' : 'Create Customer'">Create Customer - Order Management</title>
  <link rel="stylesheet" href="/css/app.css"/>
  <script defer src="/js/app.js"></script>
</head>
<body>
  <div class="container">
    <h1 class="title" th:text="${customer.id} != null ? 'Edit Customer' : 'Create Customer'"></h1>
    <p class="subtle">Provide customer details below.</p>
    <form th:action="@{/customers/save}" th:object="${customer}" method="post">
      <input type="hidden" th:if="${customer.id} != null" th:field="*{id}"/>
      <div class="form-row">
        <div>
          <label>Name</label>
          <input type="text" th:field="*{name}" required/>
        </div>
        <div>
          <label>Email</label>
          <input type="email" th:field="*{email}" placeholder="name@example.com"/>
        </div>
      </div>
      <div class="form-row">
        <div>
          <label>Contact</label>
          <input type="text" th:field="*{contactNumber}" />
        </div>
        <div>
          <label>Address</label>
          <input type="text" th:field="*{address}" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-primary" type="submit">Save</button>
        <a class="btn" href="/customers/dashboard">Cancel</a>
      </div>
    </form>
  </div>
</body>
</html>
